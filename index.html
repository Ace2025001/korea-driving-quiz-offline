<style>*{box-sizing:border-box}
:root{--bg:#edf3f1;--paper:#fff;--ink:#142e2d;--muted:#506765;--line:#cad9d4;--teal:#086750;--mist:#e3f1eb;--dark:#102d2c;--amber:#754600;--sand:#fff3d8;--danger:#9c322d;--rose:#ffedeb;--radius:18px;font-family:system-ui,"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:var(--bg);line-height:1.58}
body{margin:0}
a{color:var(--teal);text-underline-offset:.2em}
button,input,select{font:inherit}
button,select,input[type=file]{min-height:44px}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #c27518;outline-offset:3px}
.shell{max-width:1060px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.skip{position:absolute;top:-70px}.skip:focus{top:4px;z-index:5;background:var(--paper);padding:8px}
.mast{background:var(--dark);color:white;border-bottom:4px solid #75bda0}
.mast-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:76px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;color:white;text-decoration:none;font-size:19px;font-weight:800;line-height:1.2}
.brand small{display:block;font-size:11px;font-weight:500;color:#c0ddd3;margin-top:5px}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid #82b7a6;border-radius:11px;color:#c0f6b0;font-size:26px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{display:block;padding:10px 12px;border-radius:9px;color:#e0f2ec;text-decoration:none;font-size:14px}
nav a[aria-current=page]{background:#28574c;color:#fff}
main{min-height:65vh;padding-block:26px 36px}
.hero{background:var(--dark);color:white;border-radius:22px;padding:clamp(22px,5vw,45px);margin-bottom:18px;box-shadow:0 6px 18px #142e2d14}
.hero p{color:#d3e7de;max-width:65ch}
.kicker{font-size:12px;letter-spacing:.13em;font-weight:750;text-transform:uppercase;color:var(--teal);margin:0 0 6px}.hero .kicker{color:#b8ed9d}
h1,h2,h3{line-height:1.22;margin:0 0 10px}
h1{font-size:clamp(26px,5vw,44px);letter-spacing:-.035em}
h2{font-size:clamp(20px,3vw,27px)}
h3{font-size:17px}
p{margin:0 0 12px}
section+section,.spaced{margin-top:16px}
.panel{padding:clamp(17px,3vw,28px);border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,214px),1fr));gap:12px}
.stats{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:0}
.stat strong{font-size:clamp(21px,4vw,30px);display:block;line-height:1.28}
.muted,.stat span{color:var(--muted)}
.small,.stat span{font-size:13px}
label.control{display:grid;gap:4px;min-width:135px}
select{background:white;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:5px 10px;width:100%}
.check{display:flex;align-items:center;min-height:44px;gap:7px}
.btn{border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:white}
.btn.soft{background:var(--mist);border-color:transparent;color:var(--teal)}
.btn.danger{color:var(--danger)}
.callout{border-radius:10px;border-left:4px solid #d9993f;padding:12px 14px;background:var(--sand);color:var(--amber);margin:10px 0}
.callout.good{border-left-color:var(--teal);background:var(--mist);color:#0a513c}
.callout.bad{border-left-color:var(--danger);background:var(--rose);color:var(--danger)}
.pill{display:inline-flex;align-items:center;border-radius:30px;border:1px solid var(--line);padding:3px 9px;font-size:12px;background:#f5f9f7;white-space:normal}
.question{font-size:clamp(20px,4vw,28px);white-space:pre-line;overflow-wrap:anywhere;margin-top:12px}
fieldset{border:0;margin:13px 0;padding:0;min-width:0}
legend{padding:0;color:var(--muted)}
.option{display:flex;align-items:flex-start;gap:10px;min-height:49px;margin:6px 0;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;overflow-wrap:anywhere}
.option input,.check input{accent-color:var(--teal);width:18px;height:18px;flex:none;margin:3px 0}
.option:has(input:checked){background:var(--mist);border-color:#72ac98}.option.ok{border:2px solid var(--teal)}.option.miss{border:2px solid var(--danger);background:var(--rose)}
.option b{font-variant-numeric:tabular-nums;color:var(--muted)}
.media{display:block;max-width:100%;max-height:62vh;border-radius:9px;margin:14px auto;object-fit:contain}
.timer{font-variant-numeric:tabular-nums;font-size:24px;font-weight:800}
.qnav{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:5px}
.qnav button{border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.qnav .filled{background:var(--mist)}.qnav .current{border:2px solid var(--teal)}
progress{width:100%;accent-color:var(--teal);height:9px;margin:8px 0}
details{border-top:1px solid var(--line);padding:11px 0}
summary{cursor:pointer;font-weight:700}
.inset{margin-top:8px;padding-left:11px}
.foot{border-top:1px solid var(--line);padding-block:12px 23px;color:var(--muted);font-size:13px}
.notice{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 16px;border-radius:12px;width:max-content;max-width:calc(100% - 28px);box-shadow:0 4px 24px #152e2c44;z-index:3}
.import-card input{max-width:100%;width:100%;margin-block:7px}

@media(prefers-reduced-motion:no-preference){.btn:hover{filter:brightness(.96)}}

const QuizStore = (() => {
  const NAME='kr-driving-quiz-1', STATE=NAME+'-study', BANKS=NAME+'-banks';
  const request=req=>new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});
  async function connect() {
    try {
      const db=await new Promise((resolve,reject)=>{
        const open=indexedDB.open(NAME,1);
        const timer=setTimeout(()=>reject(Error('本地数据库打开超时')),2500);
        open.onupgradeneeded=()=>{open.result.createObjectStore('banks');open.result.createObjectStore('state');};
        open.onsuccess=()=>{clearTimeout(timer);resolve(open.result);};
        open.onerror=()=>{clearTimeout(timer);reject(open.error);};
      });
      const tx=(stores,mode,fn)=>{
        const t=db.transaction(stores,mode);
        return new Promise((resolve,reject)=>{
          t.oncomplete=()=>resolve(); t.onabort=()=>reject(t.error||Error('写入中断')); t.onerror=()=>reject(t.error);
          try { fn(t); } catch(e){t.abort();reject(e);}
        });
      };
      await tx('state','readwrite',t=>t.objectStore('state').put(1,'probe'));
      return {label:'IndexedDB',
        load:async()=>({banks:await request(db.transaction('banks').objectStore('banks').getAll()),
          study:await request(db.transaction('state').objectStore('state').get('study'))}),
        bank:(key,bank)=>tx('banks','readwrite',t=>t.objectStore('banks').put(bank,key)),
        study:study=>tx('state','readwrite',t=>t.objectStore('state').put(study,'study')),
        restore:(packs,study)=>tx(['state','banks'],'readwrite',t=>{
          const b=t.objectStore('banks');b.clear();packs.forEach(p=>b.put(p.bank,p.key));
          t.objectStore('state').put(study,'study');
        })
      };
    } catch {
      let storage;
      try { storage=localStorage;storage.setItem(NAME+'-probe','1');storage.removeItem(NAME+'-probe'); } catch { storage=null; }
      if (!storage) return {label:'仅本次打开',load:async()=>({banks:[]}),bank:async()=>{},study:async()=>{},restore:async()=>{}};
      const get=(key,fallback)=>JSON.parse(storage.getItem(key)||fallback);
      const set=(key,value)=>storage.setItem(key,JSON.stringify(value));
      // 完整恢复只改一个键，避免写入两份数据时留下半份备份。
      const base=()=>get(BANKS,'{"banks":[],"revision":null}');
      return {label:'localStorage',
        load:async()=>{const b=base(),s=get(STATE,'null');return {banks:b.banks.map(([,value])=>value),study:s&&s.revision===b.revision?s.study:b.study};},
        bank:async(key,bank)=>{const b=base(),m=new Map(b.banks);m.set(key,bank);set(BANKS,{...b,banks:[...m]});},
        study:async study=>set(STATE,{study,revision:base().revision}),
        restore:async(packs,study)=>set(BANKS,{banks:packs.map(p=>[p.key,p.bank]),study,revision:String(Date.now())+'-'+Math.random()})};
    }
  }
  return {connect};
})();

  function validateStudy(raw,destination){
    if(!raw||typeof raw!=='object'||!raw.stats||!raw.exams)throw Error('备份没有有效学习记录。');
    const clean=empty(), keyOK=k=>destination.has(k);
    const entries=x=>{if(!x||typeof x!=='object'||Array.isArray(x))throw Error('学习记录格式无效。');return Object.entries(x);};
    const integer=(n,min,max)=>Number.isSafeInteger(n)&&n>=min&&n<=max;
    const question=(k,id)=>destination.get(k).bank.questions.find(q=>q.question_id===id);
    const validChoice=(q,selected)=>Array.isArray(selected)&&new Set(selected).size===selected.length&&
      selected.every(a=>q.options.some(o=>o.id===a))&&(q.question_type==='multiple'||selected.length<=1);
    for(const [k,value] of entries(raw.stats)){
      if(!keyOK(k))throw Error('备份需要相同内容的题库：'+k.split('@')[0]);
      clean.stats[k]={};
      for(const [id,s] of entries(value)){
        if(!question(k,id)||!Quiz.validStat(s))throw Error('发现无效的做题记录：'+id);
        clean.stats[k][id]={attempts:s.attempts,correct:s.correct,wrong:s.wrong,streak:s.streak,last:s.last,due:s.due,favorite:s.favorite};
      }
    }
    for(const [k,list] of entries(raw.exams)){
      if(!keyOK(k)||!Array.isArray(list)||list.length>30)throw Error('备份含无效考试记录或缺少相同题库。');
      clean.exams[k]=list.map(h=>{
        if(!h||!Array.isArray(h.rows)||h.rows.length!==40||!['1','2'].includes(h.license)||
          !integer(h.finished,1,8640000000000000)||new Set(h.rows.map(r=>r?.id)).size!==40)
          throw Error('考试记录格式无效。');
        const qs=h.rows.map(row=>question(k,row?.id));
        if(qs.some((q,i)=>!q||!validChoice(q,h.rows[i].selected)))throw Error('考试题号或选择无效。');
        return {...Quiz.result(qs,Object.fromEntries(h.rows.map(r=>[r.id,r.selected]))),finished:h.finished,license:h.license,auto:h.auto===true};
      });
    }
    clean.active=keyOK(raw.active)?raw.active:null;
    if(raw.ongoing){
      const {key,ids,index,answers,license,ends}=raw.ongoing;
      const p=destination.get(key);
      if(!p?.manifest||!['1','2'].includes(license)||!integer(ends,1,8640000000000000)||!integer(index,0,39)||
        !Array.isArray(ids)||ids.length!==40||new Set(ids).size!==40||
        !ids.every(id=>p.ready[id]&&p.manifest.ordinary_ranges.some(([a,b])=>+id>=a&&+id<=b))||
        !entries(answers).every(([id,a])=>ids.includes(id)&&validChoice(question(key,id),a)))throw Error('进行中的考试记录无效或缺少素材。');
      clean.ongoing={key,ids,index,answers,license,ends};
    }
    return clean;
  }
  function combine(old, next) {
    if(!old?.manifest || !next.manifest)return next;
    const qs=new Map(old.bank.questions.map(q=>[q.question_id,q]));
    for(const q of next.bank.questions){
      const before=qs.get(q.question_id);
      if(before){
        if(old.media[q.question_id]==='素材已核验'&&next.media[q.question_id]!=='素材已核验'){
          q.image_asset=before.image_asset;q.video_asset=before.video_asset;
        }
        if(before.official_explanation_ko&&!q.official_explanation_ko){
          q.official_explanation_ko=before.official_explanation_ko;q.evidence.ko_page=before.evidence.ko_page;
        }
      }
      qs.set(q.question_id,q);
    }
    return Quiz.validateBank({...next.bank,questions:[...qs.values()].sort((a,b)=>+a.question_id-+b.question_id)},manifests);
  }
  async function addBank(raw,write){
    let p=await Quiz.validateBank(raw,manifests);
    if(packs.has(p.key))p=await combine(packs.get(p.key),p);

        document.getElementById('storage').textContent='｜题库无法写入存储';
      }
    }
    packs.set(p.key,p);
    return p;
  }

    pending=true;
    const header=main.querySelector('h1');
    if(header)header.textContent=restore?'正在检查备份…':'正在核对题库指纹和素材…';
    try{
      const raw=await readFile(restore?'backup-file':'bank-file');
      if(!restore){
        const p=await addBank(raw,true);
        study.active=p.key;
        filters={topic:'',trap:'',media:'',audit:p.manifest?'verified':'all',incomplete:false};
        await save();
        const ct=coverage(p);
        if(document.getElementById('storage').textContent.includes('失败')||document.getElementById('storage').textContent.includes('无法'))
          notify('已临时加载 '+number(ct.total)+' 道题；请保留原 JSON，设备存储未能完整写入。');
        else notify('已加载 '+number(ct.total)+' 道题 · 原件已核对 '+number(ct.verified)+' 道');
      }else{
        if(raw?.format!=='kr-driving-quiz-backup'||raw.version!==1||!(raw.banks===null||Array.isArray(raw.banks)&&raw.banks.length<=50))
          throw Error('备份文件类型或版本无效。');
        const destination=new Map(packs);
        if(raw.banks!==null)for(const bank of raw.banks){
          let p=await Quiz.validateBank(bank,manifests);
          if(destination.has(p.key))p=await combine(destination.get(p.key),p);
          destination.set(p.key,p);
        }
        const next=validateStudy(raw.study,destination);
        if(!confirm('已校验备份。恢复会替换本设备的学习记录和进行中的考试，同时保留已导入的题库。继续？'))return;
        await saveQueue;
        await db.restore([...destination.values()],next);
        packs.clear();destination.forEach((v,k)=>packs.set(k,v));
        study=next;if(!current())study.active=preferred();
        run=null;examView=null;notify('备份恢复成功。');
      }
    } finally {pending=false;render();}
  }

  main.addEventListener('change',ev=>{
    const el=ev.target;
    if(el.matches('[data-answer]')){choose(el);return;}
    if(el.id==='exam-video'){examVideo=el.checked;return;}
    if(el.id==='bank'&&packs.has(el.value)){
      study.active=el.value;filters={topic:'',trap:'',media:'',audit:current().manifest?'verified':'all',incomplete:false};save();render();return;
    }
    if(['topic','trap','media','audit','incomplete'].includes(el.id)){
      filters[el.id]=el.id==='incomplete'?el.checked:el.value;render();document.getElementById(el.id)?.focus();
    }
  });
  main.addEventListener('click',async ev=>{
    const target=ev.target.closest('[data-do]');
    if(!target||pending)return;
    const [action,arg]=target.dataset.do.split(':');
    try{
      if(action==='practice')openPractice(arg);
      if(action==='exam')startExam();
      if(action==='next')move(run.index+1);
      if(action==='prev')move(run.index-1);
      if(action==='jump')move(+arg);
      if(action==='submit')submitExam();
      if(action==='import'||action==='restore')await doFile(action==='restore');
      if(action==='backup'||action==='progress')
        saveFile({format:'kr-driving-quiz-backup',version:1,created:new Date().toISOString(),
          banks:action==='backup'?[...packs.values()].map(p=>p.bank):null,study},action==='backup'?'完整':'进度');
      if(action==='favorite'&&run?.kind==='practice'){
        const q=run.questions[run.index], s=pstats(q.question_id,run.key);
        setProgress(run.key,q.question_id,{...s,favorite:!s.favorite});save();
        target.textContent=s.favorite?'加入收藏':'取消收藏';notify(s.favorite?'已取消收藏。':'已收藏。');
      }
      if(action==='check'&&run?.kind==='practice'){
        const q=run.questions[run.index], id=q.question_id, choices=run.answers[id];
        if(!choices?.length||run.checked[id])return;
        run.checked[id]=true;
        setProgress(run.key,id,Quiz.attempt(pstats(id,run.key),Quiz.sameAnswer(choices,q.correct_answers)));
        save();render();
      }
      if(action==='rule'&&current()){
        filters={topic:'',trap:rules[+arg].title,media:'',audit:current().manifest?'verified':'all',incomplete:false};openPractice('sequence');
      }
      if(action==='history'&&current()){
        const result=study.exams[study.active]?.[0];
        if(result){examView={key:study.active,result,auto:result.auto};nav('result');}
      }
      if(action==='revisit'&&examView){
        const q=packs.get(examView.key)?.bank.questions.find(q=>q.question_id===arg);
        if(q){run={kind:'practice',key:examView.key,index:0,questions:[q],answers:{},checked:{},mode:'wrong'};nav('quiz');}
      }
    }catch(e){notify(e.message||'操作失败。');}
  });

  (async()=>{
    db=await QuizStore.connect();
    const storageLabel=document.getElementById('storage');
    storageLabel.textContent='｜存储方式：'+db.label;
    if(db.label==='仅本次打开')notify('浏览器不允许持久保存。请在关闭页面前导出备份。');
    // 先读本机库；新私人离线文件可以补齐旧库缺失的官方素材。
    let saved;
    try {saved=await db.load();if(saved.study)study=saved.study;}
    catch{notify('本地存储读取失败。若有备份，请从数据管理恢复。');}
    for(const raw of [...saved?.banks||[],...embedded]){
      main.firstElementChild.textContent='正在核对本地题库与素材…';
      try{await addBank(raw,false);}catch{notify('一份已存在的题库无法通过校验。');}
    }
    if(!current())study.active=preferred();
    if(study.ongoing&&!examObjects(study.ongoing)){study.ongoing=null;save();notify('已保存的模拟缺少完整题库，无法继续。');}
    window.addEventListener('hashchange',()=>render(true));
    document.addEventListener('visibilitychange',tick);
    setInterval(tick,500);
    render();
  })().catch(e=>{main.textContent='启动失败：'+e.message;});
})();
</script>
</body>
</html>
